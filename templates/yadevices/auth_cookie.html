<p>
    Для работы данного способа, необходимо скачать файл с данными Cookie сформированный на странице <a href="https://yandex.ru/iot/" target="_blank">Yandex IOT</a>.
    После скачивания файла его необходимо загрузить в данную форму.
</p>
<form action="?" method="post" enctype="multipart/form-data" class="ya-form-loading ya-card ya-card-soft">
    <div class="form-group">
        <input name="file" type="file" class="form-control">
    </div>
    &nbsp;
    <div class="form-group">
        <button type="submit" id="Cookie_upload" name="submit" class="btn btn-success"><span class="ya-loader"></span>Загрузить</button>
        <a href="?view_mode=<#VIEW_MODE#>" class="btn btn-default"><#LANG_CANCEL#></a>
    </div>
    <input type="hidden" name="view_mode" value="<#VIEW_MODE#>">
    <input type="hidden" name="type" value="<#TYPE#>">
</form>
