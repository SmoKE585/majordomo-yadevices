<section class="md-card md-yv-auth-card">
    <header class="md-card__head">
        <div class="md-card__titles">
            <div class="md-card__eyebrow">Cookie</div>
            <h2 class="md-card__title">Загрузка cookie-файла</h2>
            <p class="md-card__subtitle">Подходит Netscape cookie, JSON из расширения браузера или строка `name=value; …`.</p>
        </div>
        <div class="md-card__actions"><a href="?view_mode=auth" class="md-btn md-btn--ghost md-btn--sm"><i class="ti ti-arrow-left" aria-hidden="true"></i>Назад</a></div>
    </header>
    <div class="md-card__body">
        <form action="?view_mode=auth&type=cookie" method="post" enctype="multipart/form-data" class="md-yv-auth-form">
            <div class="md-field">
                <label class="md-field__label" for="yv-cookie-file">Файл cookie</label>
                <div class="md-field__control">
                    <input class="md-input" id="yv-cookie-file" type="file" name="file" accept=".txt,.json,text/plain,application/json" required>
                </div>
                <div class="md-field__hint">Скачайте cookie на странице <a href="https://yandex.ru/iot/" target="_blank" rel="noopener">yandex.ru/iot</a> или экспортируйте из браузера.</div>
            </div>
            <div class="md-yv-auth-form__actions">
                <button type="submit" class="md-btn md-btn--primary"><i class="ti ti-upload" aria-hidden="true"></i>Загрузить и проверить</button>
                <a href="?view_mode=auth" class="md-btn md-btn--secondary">Отмена</a>
            </div>
        </form>
    </div>
</section>
