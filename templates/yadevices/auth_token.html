<section class="md-card md-yv-auth-card">
    <header class="md-card__head">
        <div class="md-card__titles">
            <div class="md-card__eyebrow">x-token</div>
            <h2 class="md-card__title">Перенос авторизации</h2>
            <p class="md-card__subtitle">Тот же account x-token, который хранит Home Assistant после QR или cookie-входа.</p>
        </div>
        <div class="md-card__actions"><a href="?view_mode=auth" class="md-btn md-btn--ghost md-btn--sm"><i class="ti ti-arrow-left" aria-hidden="true"></i>Назад</a></div>
    </header>
    <div class="md-card__body">
        <div class="md-alert md-alert--info">
            <i class="ti ti-info-circle" aria-hidden="true"></i>
            <div>Не вставляйте сюда device token станции или OAuth-токен Яндекс.Музыки. Нужен длинный account x-token.</div>
        </div>
        <form action="?view_mode=auth&type=token" method="post" class="md-yv-auth-form">
            <div class="md-field">
                <label class="md-field__label" for="yv-x-token">x-token</label>
                <div class="md-field__control">
                    <textarea class="md-textarea" id="yv-x-token" name="x_token" rows="4" placeholder="Вставьте x-token" spellcheck="false" required></textarea>
                </div>
            </div>
            <div class="md-yv-auth-form__actions">
                <button type="submit" class="md-btn md-btn--primary"><i class="ti ti-key" aria-hidden="true"></i>Проверить и сохранить</button>
                <a href="?view_mode=auth" class="md-btn md-btn--secondary">Отмена</a>
            </div>
        </form>
    </div>
</section>
