<link rel="stylesheet" href="<#ROOTHTML#>assets/modules/yadevices/yadevices.css?v=2026-10-22-1">
<script src="<#ROOTHTML#>assets/modules/yadevices/player.js?v=2026-10-22-1" defer></script>

<div class="md-yv-player" id="yv-player"
     data-station="[#STATION_ID#]"
     data-title="[#TITLE#]"
     data-bg="[#BGCOLOR#]"
     data-text="[#TEXTCOLOR#]"
     data-zoom="[#ZOOM_PLAYER#]"
     data-root="<#ROOTHTML#>">
    <div class="md-yv-player__cover" data-yv-cover>
        <div class="md-yv-player__top">
            <span class="md-yv-player__eyebrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h3l4 -4v16l-4 -4h-3z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>Я.Устройства</span>
            <span class="md-status md-status--idle" data-yv-player-state><span class="md-status__dot"></span>ожидание</span>
        </div>
        <div class="md-yv-player__main">
            <div class="md-yv-player__track" data-yv-track>[#if TITLE==''#]yadevices[#else#][#TITLE#][#endif#]</div>
            <div class="md-yv-player__artist" data-yv-artist>[#if TITLE==''#]Управление музыкой[#else#][#TITLE#][#endif#]</div>
            <div class="md-yv-player__time">
                <span data-yv-current>0:00</span>
                <span class="md-yv-player__divider">/</span>
                <span data-yv-duration>0:00</span>
                <span class="md-yv-player__volume"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h3l4 -4v16l-4 -4h-3z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg><span data-yv-volume>[#VOLUME#]</span></span>
            </div>
        </div>
        <div class="md-yv-player__controls">
            <button type="button" class="md-yv-player__btn" data-yv-control="prev" aria-label="Предыдущий трек">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5v14"/><path d="M19 5l-10 7 10 7V5z"/></svg>
            </button>
            <button type="button" class="md-yv-player__btn" data-yv-control="play" aria-label="Воспроизвести">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13 -8z"/></svg>
            </button>
            <button type="button" class="md-yv-player__btn" data-yv-control="stop" aria-label="Пауза">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
            </button>
            <button type="button" class="md-yv-player__btn" data-yv-control="next" aria-label="Следующий трек">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5l10 7 -10 7V5z"/><path d="M20 5v14"/></svg>
            </button>
            <button type="button" class="md-yv-player__btn" data-yv-control="volumeDown" aria-label="Тише">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15h-2a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 1 -1h2l3.5 -4.5a.8 .8 0 0 1 1.5 .5v14a.8 .8 0 0 1 -1.5 .5l-3.5 -4.5"/><path d="M15 8a5 5 0 0 1 0 8"/></svg>
            </button>
            <button type="button" class="md-yv-player__btn" data-yv-control="volumeUp" aria-label="Громче">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15h-2a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 1 -1h2l3.5 -4.5a.8 .8 0 0 1 1.5 .5v14a.8 .8 0 0 1 -1.5 .5l-3.5 -4.5"/><path d="M15 8a5 5 0 0 1 0 8"/><path d="M18 5a9 9 0 0 1 0 14"/></svg>
            </button>
        </div>
    </div>
</div>
